# FR-RL3: CI integration for eval suites (GitHub Actions).
# Runs the deterministic/offline eval, release-gate, and red-team security suites
# on every push and pull request. A regression fails the job and blocks the merge.
# No secrets, no live stack, no paid services — the gated suites are pure/offline.
name: eval-suites

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  eval-gate:
    runs-on: ubuntu-24.04
    env:
      # Hosted CI has no live E2EAIDEV stack; DB-backed suites skip cleanly while
      # deterministic eval/release/security logic still gates regressions.
      E2EAI_SKIP_DB_TESTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"

      - name: Sync API deps
        working-directory: apps/api
        run: uv sync --frozen

      - name: Run eval / release / security gate
        run: python scripts/ci_eval_gate.py
