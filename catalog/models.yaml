# Model catalog for the install wizard (FR-F5a). No model here is a default: the wizard filters by
# hardware and the user chooses. Verified 2026-10-05: Ollama tags exist in registry.ollama.ai,
# licenses read from the Hugging Face model cards. Re-verify before each phase (PRD §17.6).
#
# mem_gb = memory needed to run (Ollama: download size x 1.2 + 0.5 GB context; TEI: fp32 weights on CPU).
# license_class: permissive | restrictive (usable commercially, with conditions) | non-commercial
models:
