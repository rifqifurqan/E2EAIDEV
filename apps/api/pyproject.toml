[project]
name = "e2eai-api"
version = "0.1.0"
description = "E2EAIDEV API (PRD Part II, T1-T2)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "aioboto3>=15.5.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pgvector>=0.4.1",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    # kombu (Celery) supports redis-py < 6.5; the API only uses basic async commands, so it follows that cap (FR-F20).
    "redis>=6.4,<6.5",
    "celery>=5.6",
    "sqlalchemy[asyncio]>=2.1.3",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.54.0",
    "tzdata>=2026.5",
]

[project.scripts]
e2eai-api = "e2eai.manage:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/e2eai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
