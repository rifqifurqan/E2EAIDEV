# E2EAIDEV infrastructure (PRD Part II, T1). Values come from .env, which the wizard writes:
#   cd cli && uv run e2eai        (then)        cd deploy/compose && docker compose up -d
# Optional services use profiles (COMPOSE_PROFILES in .env). Every port binds to BIND_ADDRESS (default 127.0.0.1).

services:
  postgres:
    image: ${E2EAI_IMAGE_POSTGRES:?run the wizard first}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: e2eai
      OPENFGA_DB_PASSWORD: ${OPENFGA_DB_PASSWORD}
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["${BIND_ADDRESS}:${POSTGRES_PORT}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d e2eai"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  valkey:
    image: ${E2EAI_IMAGE_VALKEY:?run the wizard first}
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${VALKEY_PASSWORD}  # lets the healthcheck authenticate without a password in argv
    volumes: [valkeydata:/data]
    ports: ["${BIND_ADDRESS}:${VALKEY_PORT}:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  openfga-migrate:
    image: ${E2EAI_IMAGE_OPENFGA:?run the wizard first}
    command: migrate
    environment: &openfga-env
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:${OPENFGA_DB_PASSWORD}@postgres:5432/openfga?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}

  openfga:
    image: ${E2EAI_IMAGE_OPENFGA:?run the wizard first}
    command: run
    environment:
      <<: *openfga-env
      OPENFGA_AUTHN_METHOD: preshared
      OPENFGA_AUTHN_PRESHARED_KEYS: ${OPENFGA_PRESHARED_KEY}
      OPENFGA_PLAYGROUND_ENABLED: "false"
    ports: ["${BIND_ADDRESS}:${OPENFGA_PORT}:8080"]
    depends_on:
      openfga-migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  seaweedfs:
    image: ${E2EAI_IMAGE_SEAWEEDFS:?run the wizard first}
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    volumes:
      - swdata:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports: ["${BIND_ADDRESS}:${S3_PORT}:8333"]
    restart: unless-stopped

  litellm:
    image: ${E2EAI_IMAGE_LITELLM:?run the wizard first}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@postgres:5432/litellm
      STORE_MODEL_IN_DB: "True"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
    volumes: ["./litellm/config.yaml:/app/config.yaml:ro"]
    ports: ["${BIND_ADDRESS}:${LITELLM_PORT}:4000"]
    extra_hosts: ["host.docker.internal:host-gateway"]  # reach an Ollama running on the host
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  ollama:
    profiles: [ollama]
    image: ${E2EAI_IMAGE_OLLAMA:-}
    volumes: [ollamadata:/root/.ollama]
    ports: ["${BIND_ADDRESS}:${OLLAMA_PORT}:11434"]
    restart: unless-stopped

  tei-embed:
    profiles: [tei-embed]
    image: ${E2EAI_IMAGE_TEI:-}
    command: ["--model-id", "${TEI_EMBED_MODEL}"]
    environment: {API_KEY: "${TEI_API_KEY}"}
    volumes: [teidata:/data]
    ports: ["${BIND_ADDRESS}:${TEI_EMBED_PORT}:80"]
    restart: unless-stopped

  tei-rerank:
    profiles: [tei-rerank]
    image: ${E2EAI_IMAGE_TEI:-}
    command: ["--model-id", "${TEI_RERANK_MODEL}"]
    environment: {API_KEY: "${TEI_API_KEY}"}
    volumes: [teidata:/data]
    ports: ["${BIND_ADDRESS}:${TEI_RERANK_PORT}:80"]
    restart: unless-stopped

  keycloak:
    profiles: [keycloak]
    image: ${E2EAI_IMAGE_KEYCLOAK:-}
    command: start-dev  # ponytail: dev mode until Caddy/TLS lands; switch to `start` for production
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    ports: ["${BIND_ADDRESS}:${KEYCLOAK_PORT}:8080"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

volumes:
  pgdata:
  valkeydata:
  swdata:
  ollamadata:
  teidata:
