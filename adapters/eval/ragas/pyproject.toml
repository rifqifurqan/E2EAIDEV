[project]
name = "e2eai-adapter-ragas"
version = "0.1.0"
description = "E2EAIDEV Lab adapter for Ragas (PRD T6): an HTTP service with /info, /health and /run. Standalone: it never imports the platform, and the platform never imports Ragas."
requires-python = ">=3.12"
dependencies = [
    "ragas>=0.4.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "openai>=1.50",
    "pydantic>=2.7",
    # ragas 0.4.3 imports langchain_community.chat_models.vertexai, which langchain-community 0.4 (sunset) removed.
    "langchain-community>=0.3.31,<0.4",
]

[project.scripts]
e2eai-adapter-ragas = "e2eai_ragas.server:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/e2eai_ragas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
