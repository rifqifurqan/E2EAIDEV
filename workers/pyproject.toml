[project]
name = "e2eai-worker"
version = "0.1.0"
description = "E2EAIDEV background worker: Celery ingestion with Docling (PRD T1/T2, FR-D3, FR-F20). Own environment: Docling pulls PyTorch and models, so it stays out of the API venv."
requires-python = ">=3.12"
dependencies = [
    "e2eai-api",
    "docling>=2.40",
    "celery[redis]>=5.4",
]

[project.scripts]
e2eai-worker = "e2eai_worker.__main__:main"

[dependency-groups]
dev = ["pytest>=8.4", "reportlab>=4.2", "pillow>=10"]

[tool.uv.sources]
e2eai-api = { path = "../apps/api", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/e2eai_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
